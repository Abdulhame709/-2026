<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAST ZONE - Activate License</title>
    <style>
        body {
            width: 340px;
            margin: 0;
            padding: 24px 20px 20px;
            background: #0c071a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            box-sizing: border-box;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Centered Official Logo */
        .logo-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            filter: drop-shadow(0 4px 15px rgba(186, 66, 255, 0.4));
        }

        /* Title & Subtitle */
        .title {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: 0.3px;
        }
        .subtitle {
            font-size: 13px;
            color: #837a9f;
            margin-bottom: 24px;
            text-align: center;
        }

        /* Input Form */
        .form-group {
            width: 100%;
            margin-bottom: 14px;
        }
        .key-input {
            width: 100%;
            background: #110b23;
            border: 1.5px solid #a55eea;
            border-radius: 10px;
            padding: 13px 14px;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Consolas', monospace;
            box-sizing: border-box;
            outline: none;
            letter-spacing: 1px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .key-input:focus {
            border-color: #ba42ff;
            box-shadow: 0 0 12px rgba(186, 66, 255, 0.5);
        }

        /* Activate Button with Purple-to-Cyan Gradient */
        .activate-btn {
            width: 100%;
            background: linear-gradient(90deg, #ba42ff 0%, #00d2d3 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 210, 211, 0.25);
            transition: opacity 0.2s, transform 0.1s;
            margin-bottom: 22px;
        }
        .activate-btn:hover {
            opacity: 0.95;
            transform: scale(1.01);
        }
        .activate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Community Section */
        .community-card {
            width: 100%;
            background: rgba(14, 18, 38, 0.85);
            border: 1.5px solid #163654;
            border-radius: 14px;
            padding: 14px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .community-title {
            color: #00d2d3;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .community-btn {
            background: #10172e;
            border: 1px solid #1c2e54;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .community-btn:hover {
            background: #162142;
            border-color: #2b457d;
        }
        .btn-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-arrow {
            color: #7b92c4;
            font-size: 14px;
            font-weight: bold;
        }

        /* Status Toast Message */
        .status-msg {
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            display: none;
            font-weight: 700;
        }
        .status-success { color: #00d2d3; }
        .status-error { color: #ff4757; }
    </style>
</head>
<body>
    <!-- OFFICIAL CENTERED LOGO -->
    <div class="logo-container">
        <img src="icons/icon128.png" class="logo-img" alt="LAST ZONE" />
    </div>

    <!-- TITLE & SUBTITLE -->
    <div class="title">Activate License</div>
    <div class="subtitle">Enter your license key to continue.</div>

    <!-- LICENSE INPUT FORM -->
    <div class="form-group">
        <input type="text" id="keyInput" class="key-input" placeholder="LZ-XXXX-XXXX-XXXX" spellcheck="false" />
    </div>
    <button id="activateBtn" class="activate-btn">Activate License</button>
    <div id="statusMsg" class="status-msg"></div>

    <!-- LAST ZONE COMMUNITY -->
    <div class="community-card">
        <div class="community-title">
            <span>✈</span>
            <span>LAST ZONE COMMUNITY</span>
        </div>

        <a href="https://t.me/+Dm8IppPh39s4YWIx" target="_blank" class="community-btn">
            <div class="btn-left">
                <span>✈</span>
                <span>📢</span>
                <span>Telegram Channel</span>
            </div>
            <span class="btn-arrow">↗</span>
        </a>

        <a href="https://t.me/monir_i0_0i" target="_blank" class="community-btn">
            <div class="btn-left">
                <span>💬</span>
                <span>💬</span>
                <span>Technical Support</span>
            </div>
            <span class="btn-arrow">↗</span>
        </a>
    </div>

    <!-- SERVER CONFIG CARD (Hidden for normal users) -->
    <div class="community-card" style="margin-top: 12px; display: none;">
        <div class="community-title" style="justify-content: space-between;">
            <span>⚡ VPS / BACKEND SERVER</span>
            <span id="serverStatusBadge" style="font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(0,210,211,0.2); color: #00d2d3;">Checking...</span>
        </div>
        <div style="display: flex; gap: 8px;">
            <input type="text" id="serverUrlInput" class="key-input" style="padding: 8px 10px; font-size: 12px; margin-bottom: 0;" placeholder="http://52.21.185.77:3000" />
            <button id="saveServerBtn" style="background: #1c2e54; border: 1px solid #2b457d; color: #fff; border-radius: 8px; padding: 0 12px; font-size: 11px; font-weight: bold; cursor: pointer; transition: background 0.2s;">Save</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
